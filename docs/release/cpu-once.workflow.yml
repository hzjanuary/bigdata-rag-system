# HISTORICAL TEMPLATE at 1ccf0d0; superseded by .github/workflows/spec001-cpu-once.yml.
# Do not install/use this ancestor-SHA template or its old label. Retained for provenance.
# PREPARED ONLY. This file is outside .github/workflows and cannot trigger Actions.
# Installation and the owner's label action require a separate explicit decision.
name: spec001-cpu-once-pr1
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: spec001-authorized-cpu-campaign-pr1
  cancel-in-progress: false
env:
  TARGET_SHA: d54b899d665b04dff2db3bd8b7415f96d8b36c9a
jobs:
  reserve:
    if: >-
      github.repository == 'hzjanuary/bigdata-rag-system' &&
      github.event.pull_request.number == 1 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'hzjanuary' && github.run_attempt == 1 &&
      github.event.label.name == 'spec001-cpu-once-d54b899d665b04dff2db3bd8b7415f96d8b36c9a'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: write
    outputs:
      marker_id: ${{ steps.reserve.outputs.marker_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d54b899d665b04dff2db3bd8b7415f96d8b36c9a
          persist-credentials: false
      - name: Reserve the single campaign before acquisition
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, subprocess, urllib.parse, urllib.request
          from pathlib import Path
          target = "d54b899d665b04dff2db3bd8b7415f96d8b36c9a"
          repo = "hzjanuary/bigdata-rag-system"
          name = "spec001-cpu-pr1-consumed"
          deadline = datetime.datetime(2026, 10, 31, tzinfo=datetime.timezone.utc)
          if datetime.datetime.now(datetime.timezone.utc) >= deadline:
              raise RuntimeError("Expired approval window; no automatic extension")
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          if not (os.environ["GITHUB_EVENT_NAME"] == "pull_request"
                  and event["action"] == "labeled" and event["number"] == 1
                  and event["repository"]["full_name"] == repo
                  and event["pull_request"]["head"]["repo"]["full_name"] == repo
                  and event["sender"]["login"] == "hzjanuary"
                  and os.environ["GITHUB_ACTOR"] == "hzjanuary"
                  and os.environ["GITHUB_RUN_ATTEMPT"] == "1"
                  and event["label"]["name"] == "spec001-cpu-once-" + target):
              raise RuntimeError("Not the exact owner/PR/SHA first-attempt label action")
          if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != target:
              raise RuntimeError("Checkout SHA mismatch")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise RuntimeError("GitHub API redirect refused")
          opener = urllib.request.build_opener(NoRedirect)
          def api(path, value=None):
              data = None if value is None else json.dumps(value).encode()
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + path, data=data,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json"})
              with opener.open(request, timeout=15) as response:
                  raw = response.read(2_000_001)
              if len(raw) > 2_000_000:
                  raise RuntimeError("Oversized GitHub API response")
              return json.loads(raw)
          pr = api("/pulls/1")
          if not (pr["state"] == "open" and pr["draft"] and pr["base"]["ref"] == "main"
                  and pr["head"]["repo"]["full_name"] == repo
                  and pr["head"]["ref"] == "feat/spec-001-oss-rag-core"
                  and pr["head"]["sha"] == event["pull_request"]["head"]["sha"]):
              raise RuntimeError("PR changed or no longer the approved same-repo Draft")
          comparison = api("/compare/" + target + "..." + pr["head"]["sha"])
          if comparison["status"] not in ("ahead", "identical") or comparison["total_commits"] > 10:
              raise RuntimeError("Target is not the narrowly reviewed PR ancestor")
          files = comparison["files"]
          paths = [p for f in files for p in (f["filename"], f.get("previous_filename")) if p]
          if len(files) >= 300 or any(
              p != ".github/workflows/spec001-cpu-once.yml"
              and not p.startswith("docs/") for p in paths):
              raise RuntimeError("PR runtime/packaging delta or incomplete comparison")
          run = api("/actions/runs/41008651605")
          if not (run["head_sha"] == target and run["status"] == "completed"
                  and run["path"] == ".github/workflows/ci.yml" and run["run_attempt"] == 1):
              raise RuntimeError("Reviewed exact-SHA CI run unavailable")
          jobs = api("/actions/runs/41008651605/jobs?per_page=100")
          if jobs["total_count"] > len(jobs["jobs"]) or not any(
              j["name"] == "source" and j["conclusion"] == "success" for j in jobs["jobs"]):
              raise RuntimeError("Reviewed source job not successful or history incomplete")
          artifact = api("/actions/artifacts/12956337422")
          if artifact["expired"] or artifact["digest"] != "sha256:5669244d1b93f2d434129427926d72cd557acc9622558d3779f211480c7b78cc":
              raise RuntimeError("Verified source artifact unavailable or changed")
          checks = api("/commits/" + target + "/check-runs?filter=all&per_page=100&check_name="
                       + urllib.parse.quote(name))
          if checks["total_count"] != 0 or checks["check_runs"]:
              raise RuntimeError("Campaign already reserved/consumed; no retry")
          # Serialized workflow: persistent marker is written BEFORE any model download.
          marker = api("/check-runs", {
              "name": name, "head_sha": target, "status": "completed", "conclusion": "neutral",
              "external_id": "spec001-pr1-once-" + os.environ["GITHUB_RUN_ID"],
              "output": {"title": "Single CPU campaign budget consumed before acquisition",
                         "summary": "Reservation only; not acceptance/security PASS. No automatic retry."}})
          if marker["head_sha"] != target or marker["name"] != name:
              raise RuntimeError("Reservation response mismatch; stop for operator review")
          record = {"campaign": "spec001-pr1-once", "consumed": True,
                    "marker_id": marker["id"], "source_sha": target,
                    "pr_head_sha": pr["head"]["sha"], "workflow_sha": os.environ["WORKFLOW_SHA"],
                    "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": 1,
                    "model_download_started": False, "acceptance_started": False}
          directory = Path(".local/ci-evidence"); directory.mkdir(parents=True, exist_ok=True)
          (directory / "consumption.json").write_text(json.dumps(record, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("marker_id=" + str(int(marker["id"])) + "\n")
          PY
      - id: evidence_guard
        run: python3 scripts/evidence_gate.py .local/ci-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.evidence_guard.outcome == 'success'
        with:
          name: cpu-consumption-${{ github.run_id }}
          path: .local/ci-evidence/
          retention-days: 90
          if-no-files-found: error
  cpu:
    needs: reserve
    if: github.run_attempt == 1 && needs.reserve.outputs.marker_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d54b899d665b04dff2db3bd8b7415f96d8b36c9a
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.9.7 && uv sync --frozen
      - name: Verify exact checkout and first attempt
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          uv run python scripts/runner_environment.py
      - name: Fresh CPU images without publication
        run: |
          docker build --build-arg SOURCE_REVISION="$TARGET_SHA" -t workspace-rag-core:local .
          docker build --build-arg SOURCE_REVISION="$TARGET_SHA" -f Dockerfile.qdrant -t workspace-rag-qdrant:local .
      - name: Bounded official pinned model acquisition
        id: acquisition
        timeout-minutes: 4
        run: uv run python scripts/acquire_model.py --accept-license-and-download --destination .local/models/minilm-10dbd2f > .local/ci-evidence/model-acquisition.json
      - name: ONE synthetic real CPU embedding and Qdrant campaign
        id: acceptance
        timeout-minutes: 12
        run: uv run python scripts/isolated_acceptance.py --approved-local-model-test --model-dir .local/models/minilm-10dbd2f --evidence .local/ci-evidence/real-cpu-qdrant.json
      - name: Record actual consumption and step outcomes
        if: always()
        env:
          MARKER_ID: ${{ needs.reserve.outputs.marker_id }}
          ACQUISITION_OUTCOME: ${{ steps.acquisition.outcome }}
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          record = {"campaign": "spec001-pr1-once", "consumed": True,
                    "marker_id": int(os.environ["MARKER_ID"]), "source_sha": os.environ["TARGET_SHA"],
                    "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                    "acquisition_outcome": os.environ["ACQUISITION_OUTCOME"],
                    "acceptance_outcome": os.environ["ACCEPTANCE_OUTCOME"],
                    "model_download_started": os.environ["ACQUISITION_OUTCOME"] in ("success", "failure", "cancelled"),
                    "acceptance_started": os.environ["ACCEPTANCE_OUTCOME"] in ("success", "failure", "cancelled")}
          directory = Path(".local/ci-evidence"); directory.mkdir(parents=True, exist_ok=True)
          (directory / "consumption.json").write_text(json.dumps(record, indent=2) + "\n")
          PY
      - id: evidence_guard
        if: always()
        run: uv run python scripts/evidence_gate.py .local/ci-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.evidence_guard.outcome == 'success'
        with:
          name: independent-cpu-${{ github.run_id }}
          path: .local/ci-evidence/
          retention-days: 90
          if-no-files-found: error
