name: workspace-rag
services:
  qdrant:
    build:
      context: .
      dockerfile: Dockerfile.qdrant
    image: workspace-rag-qdrant:local
    restart: unless-stopped
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    environment:
      QDRANT__TELEMETRY_DISABLED: 'true'
      QDRANT__SERVICE__ENABLE_STATIC_CONTENT: 'false'
    volumes:
      - qdrant_data:/qdrant/storage
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /qdrant/snapshots:size=128m,uid=10001,gid=10001,mode=0700
    networks: [private]
  api:
    build: .
    image: workspace-rag-core:local
    user: '${RAG_UID:-10001}:${RAG_GID:-10001}'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    ports: ['127.0.0.1:${RAG_PORT:-8000}:8000']
    environment:
      RAG_CONFIG: /private/config/config.json
    volumes:
      - ${RAG_PRIVATE_DIR:-./.local/operator}/config:/private/config:ro
      - ${RAG_PRIVATE_DIR:-./.local/operator}/state:/private/state
      - ${RAG_MODEL_DIR:-./.local/models/minilm-10dbd2f}:/private/model:ro
    tmpfs: ['/tmp:size=64m,mode=1777']
    depends_on:
      qdrant: {condition: service_healthy}
    networks: [private, ingress]
networks:
  private:
    internal: true
  ingress:
    driver: bridge
volumes:
  qdrant_data:
